    <script>
      // Activa las animaciones de entrada solo si hay JS; si la app no arranca en 4 s, se muestra todo igualmente.
      (function (d) {
        d.classList.add('js');
        setTimeout(function () { if (!d.classList.contains('ready')) d.classList.remove('js'); }, 4000);
      })(document.documentElement);
    </script>
  </head>
  <body>
    <app-root></app-root>
    <noscript><style>.js [data-reveal], .js [data-wipe] { opacity: 1 !important; transform: none !important; filter: none !important; clip-path: none !important; }</style></noscript>
  </body>
